name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./apps/mobile
        run: npm install

      - name: Extract Env from eas.json
        working-directory: ./apps/mobile
        run: |
          jq -r '.build.preview.env | to_entries | map("\(.key)=\(.value)") | .[]' eas.json > .env
          echo "Created .env file for build:"
          cat .env

      - name: Prebuild Android project
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK (Gradle)
        working-directory: ./apps/mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
